name: Bug report
description: Something is broken or produces a wrong number
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the company / ticker and the page or CLI command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
